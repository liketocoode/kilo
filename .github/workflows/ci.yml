# Continuous integration: the tests (which include the translation check) on every push and pull
# request, on the Python that production runs and on the newest one, the browser tests in
# Chromium, plus ruff with the committed ruff.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older, still running check pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what production runs; 3.14 catches what the next upgrade would break.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      # tests/conftest.py compiles the catalogs itself, and tests/test_i18n_catalogs.py runs
      # scripts/check_i18n.py, so this one step also checks the translations. The coverage
      # report fails the step when coverage drops below fail_under in .coveragerc.
      - name: Test
        run: coverage run -m pytest -q && coverage report

  # The page script's flows in a real browser (tests/e2e/, Playwright). A job of its own: the
  # normal tests do not install Playwright or a browser, and leave these out (pytest.ini).
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          pip install -r requirements-e2e.txt
          playwright install --with-deps chromium
      - name: Browser tests
        run: pytest -m e2e -q

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned in requirements-lint.txt: a newer ruff can add findings for the same code. Dependabot
      # proposes a new version; its pull request shows here what that version finds.
      - name: Install
        run: pip install -r requirements-lint.txt
      - name: Ruff
        run: ruff check --output-format=github .
