[pytest]
pythonpath = .
# The browser tests (tests/e2e/, marked e2e) need Playwright and a browser: run them with
# `pytest -m e2e` (a later -m on the command line replaces this one).
addopts = -m "not e2e"
markers =
    real_hash: hash emailed codes with production's scrypt (see conftest.fast_code_hashes)
    e2e: browser tests with Playwright (see requirements-e2e.txt)
    expected_http_errors: a browser test in which a failed request is expected (tests/e2e/conftest.py)
